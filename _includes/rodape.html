<script>
(function(){
  var d = new Date();
  var dias = ['Domingo','Segunda-feira','Terça-feira','Quarta-feira','Quinta-feira','Sexta-feira','Sábado'];
  var meses = ['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
  var el = document.getElementById('data-hoje');
  if (el) el.textContent = dias[d.getDay()]+', '+d.getDate()+' de '+meses[d.getMonth()]+' de '+d.getFullYear();
  // menu mobile
  var btnMenu = document.getElementById('btn-menu');
  var navEl = document.querySelector('.nav');
  if (btnMenu && navEl) {
    btnMenu.addEventListener('click', function(){
      navEl.classList.toggle('aberto');
    });
  }

  var bb = document.getElementById('buscabar');
  var campo = document.getElementById('campo-busca');
  var res = document.getElementById('busca-res');
  var btn = document.getElementById('btn-busca');
  if (!btn) return;
  btn.addEventListener('click', function(){
    bb.classList.toggle('on');
    if (bb.classList.contains('on')) campo.focus();
  });
  var indice = [];
  try { indice = JSON.parse(document.getElementById('indice-busca').textContent); } catch(e){}
  function limpa(t){ return (t||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,''); }
  campo.addEventListener('input', function(){
    var q = limpa(campo.value.trim());
    if (q.length < 2){ res.innerHTML = ''; return; }
    var achados = indice.filter(function(i){
      return limpa(i.t).indexOf(q) > -1 || limpa(i.r).indexOf(q) > -1 || limpa(i.s).indexOf(q) > -1;
    }).slice(0, 8);
    res.innerHTML = achados.length
      ? achados.map(function(i){ return '<a href="'+i.u+'"><span class="bs">'+i.s+'</span>'+i.t+'</a>'; }).join('')
      : '<div class="busca-vazio">Nada encontrado.</div>';
  });
})();
</script>
