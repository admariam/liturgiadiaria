<!-- barra utilitária -->
<div class="utilbar">
  <div class="utilbar-in">
    <span class="versiculo">“Ide e anunciai o Evangelho a toda criatura” · Mc 16,15</span>
    <span class="dir">
      <span class="data" id="data-hoje"></span>
      <a href="{{ '/reflexoes/' | relative_url }}">Liturgia diária</a>
    </span>
  </div>
</div>

<!-- header -->
<header class="hdr">
  <div class="hdr-in">
    <a class="marca" href="{{ '/' | relative_url }}">
      <span class="nome">Ide, Anunciai</span>
    </a>
    <nav class="nav">
      <a{% if page.url == "/" %} class="on"{% endif %} href="{{ '/' | relative_url }}">Início</a>
      <a{% if page.url contains "/reflexoes/" or page.secao == "reflexoes" %} class="on"{% endif %} href="{{ '/reflexoes/' | relative_url }}">Reflexões</a>
      <a{% if page.url contains "/artigos/" or page.secao == "artigos" %} class="on"{% endif %} href="{{ '/artigos/' | relative_url }}">Artigos</a>
      <a{% if page.url contains "/leituras/" or page.secao == "leituras" %} class="on"{% endif %} href="{{ '/leituras/' | relative_url }}">Leituras</a>
      <a{% if page.url contains "/catequeses/" or page.secao == "catequeses" %} class="on"{% endif %} href="{{ '/catequeses/' | relative_url }}">Catequeses</a>
      <a{% if page.url contains "/pregacoes/" or page.secao == "pregacoes" %} class="on"{% endif %} href="{{ '/pregacoes/' | relative_url }}">Pregações</a>
        <a{% if page.url contains "/quaresmas/" %} class="on"{% endif %} href="{{ '/quaresmas/sao-miguel/' | relative_url }}">Quaresmas</a>
    </nav>
    <div class="hdr-acoes">
      <button class="btn-icone" id="btn-busca" aria-label="Buscar">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
      </button>
      <button class="btn-icone btn-menu" id="btn-menu" aria-label="Menu">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
      </button>
    </div>
  </div>
  <div class="buscabar" id="buscabar">
    <div class="buscabar-in">
      <input type="text" id="campo-busca" placeholder="Buscar reflexões, artigos, catequeses…" autocomplete="off">
      <div class="busca-res" id="busca-res"></div>
    </div>
  </div>
</header>
